name: Phase 12 multiarch smoke
on:
  push:
    branches:
      - phase12-arm64-ci
  workflow_dispatch:
permissions: { contents: read }
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # Pinned immutable disposable services:
    # postgres:17-bookworm@sha256:b260573038b3770e3d1aba5a9a033bdd19c4b16304b104d4b4256c75d8f15123
    # redis:7-bookworm@sha256:737124266fd276e62abb75a2ca2eadfb95f81cfa82cc7c9a5f1f7d487b9c9e10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Verify native ARM64 host
        run: |
          echo "uname=$(uname -m)"
          test "$(uname -m)" = "aarch64"
          echo "node=$(node -p 'process.arch')"
          test "$(node -p 'process.arch')" = "arm64"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @floz/infra test
      - name: Build and smoke native images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            & ./scripts/phase12-build-multiarch.ps1 -Platform linux/arm64
            if ($LASTEXITCODE) { throw "build failed with exit code $LASTEXITCODE" }
            & ./scripts/phase12-image-smoke.ps1 -Platform linux/arm64
            if ($LASTEXITCODE) { throw "smoke failed with exit code $LASTEXITCODE" }
          } catch {
            Write-Host "Error details: $_"
            Write-Host "Exception: $($_.Exception.ToString())"
            exit 1
          }
