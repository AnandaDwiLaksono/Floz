name: Phase 12 multiarch smoke
on:
  push:
    branches:
      - phase12-arm64-ci
  workflow_dispatch:
permissions: { contents: read }
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm@sha256:b260573038b3770e3d1aba5a9a033bdd19c4b16304b104d4b4256c75d8f15123
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: floz }
        options: --health-cmd "pg_isready -U postgres -d floz" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-bookworm@sha256:737124266fd276e62abb75a2ca2eadfb95f81cfa82cc7c9a5f1f7d487b9c9e10
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @floz/infra test
      - name: Build and smoke native images
        shell: pwsh
        run: |
          ./scripts/phase12-build-multiarch.ps1 -Platform linux/arm64
          ./scripts/phase12-image-smoke.ps1 -Platform linux/arm64 -DatabaseUrl postgres://postgres:postgres@127.0.0.1:5432/floz -RedisUrl redis://127.0.0.1:6379
