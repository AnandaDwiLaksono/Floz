name: Phase 12 multiarch smoke
on:
  push:
    branches:
      - phase12-arm64-ci
  workflow_dispatch:
permissions: { contents: read }
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # Pinned immutable disposable services:
    # postgres:17-bookworm@sha256:b260573038b3770e3d1aba5a9a033bdd19c4b16304b104d4b4256c75d8f15123
    # redis:7-bookworm@sha256:737124266fd276e62abb75a2ca2eadfb95f81cfa82cc7c9a5f1f7d487b9c9e10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Verify native ARM64 host
        run: |
          echo "uname=$(uname -m)"
          test "$(uname -m)" = "aarch64"
          echo "node=$(node -p 'process.arch')"
          test "$(node -p 'process.arch')" = "arm64"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @floz/infra test
      - name: Build and smoke native images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./scripts/phase12-build-multiarch.ps1 -Platform linux/arm64
            & ./scripts/phase12-image-smoke.ps1 -Platform linux/arm64
            docker buildx build --platform linux/arm64 --load -f infra/docker/backup.Dockerfile -t floz-backup:phase12 .
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 floz-backup:phase12 -e 'console.log("uname=" + require("os").arch() + " uid=" + process.getuid())'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 --entrypoint pg_dump floz-backup:phase12 --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 --entrypoint pg_restore floz-backup:phase12 --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 --entrypoint age floz-backup:phase12 --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 --entrypoint mc floz-backup:phase12 --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 --entrypoint sh floz-backup:phase12 -c 'test -r /etc/ssl/certs/ca-certificates.crt && id -u | grep -v "^0$"'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            docker run --rm --platform linux/arm64 --entrypoint sh floz-backup:phase12 -c 'set -eu; age-keygen -o /tmp/id.txt; PUB=$(age-keygen -y /tmp/id.txt); echo "arm64-smoke" | age -r "$PUB" > /tmp/smoke.age; RES=$(age -d -i /tmp/id.txt /tmp/smoke.age); test "$RES" = "arm64-smoke"; echo AGE_ARM64_OK'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } catch {
            $msg = $_.ToString()
            $stack = $_.ScriptStackTrace
            Write-Host "::error::Smoke failure: $msg at $stack"
            "## ARM64 Smoke Failure`n`n$msg`n$stack" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
