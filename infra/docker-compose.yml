services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST:?API_HOST required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
      TRUSTED_PROXY_IPS: 172.30.0.2
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:?CADDY_TLS_MODE required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks:
      ingress: {}
      private:
        ipv4_address: 172.30.0.2
  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    expose: ["3001"]
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required}
      TRUSTED_PROXY_IPS: 172.30.0.2
    networks: [private]
  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    expose: ["3000"]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
    networks: [private]
  worker:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
    networks: [private]
    tmpfs: ["/run/floz-worker:rw,noexec,nosuid,size=1m,mode=1777"]
    read_only: true
  migrator:
    build: { context: .., dockerfile: infra/docker/migrate.Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
    networks: [private]

networks:
  ingress: {}
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes: { caddy_data: {}, caddy_config: {} }
